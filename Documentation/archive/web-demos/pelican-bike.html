<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f5ed">
  <title>海岸慢行 · 鹈鹕的骑行日记</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f5ed;
      --ink: #29484a;
      --muted: #788581;
      --orange: #df7956;
      --line: #deded1;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid var(--orange); outline-offset: 5px; }
    .page { width: min(1200px, calc(100% - 80px)); margin: 0 auto; }
    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 0 24px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 34px; height: 34px; }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: .15em; }
    .brand-caption { margin-top: 3px; font-size: 8px; letter-spacing: .23em; color: var(--muted); }
    .weather { display: flex; gap: 9px; align-items: center; font-size: 12px; letter-spacing: .08em; color: #73817a; }
    .weather svg { width: 20px; height: 20px; }
    .intro { text-align: center; padding: 34px 0 30px; }
    .eyebrow { color: var(--orange); font-size: 10px; font-weight: 600; letter-spacing: .28em; }
    h1 {
      margin: 12px 0 11px;
      font-family: "Songti SC", "STZhongsong", "Noto Serif CJK SC", "SimSun", serif;
      font-size: clamp(28px, 3.5vw, 44px);
      font-weight: 500;
      letter-spacing: .055em;
      line-height: 1.4;
    }
    .intro p { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: .06em; line-height: 1.8; }
    .scene-shell {
      overflow: hidden;
      position: relative;
      border-radius: 24px;
      background: #f6e8cd;
      isolation: isolate;
      box-shadow: 0 14px 40px -25px #5b6a4d45;
    }
    .scene { display: block; width: 100%; height: auto; }
    .scene-corner {
      position: absolute;
      top: 24px;
      left: 27px;
      color: #6b817b;
      font-size: 9px;
      letter-spacing: .2em;
      pointer-events: none;
    }
    .scene-corner::before { content: ""; display: inline-block; width: 20px; height: 1px; margin: 0 9px 3px 0; background: currentColor; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 23px 2px 28px; }
    .playback { display: flex; align-items: center; gap: 20px; }
    .play-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 0;
      padding: 11px 17px;
      border-radius: 25px;
      background: var(--ink);
      color: #fffaf0;
      font-size: 12px;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }
    .play-toggle:hover { background: #3d6261; transform: translateY(-1px); }
    .play-toggle svg { width: 14px; height: 14px; }
    .play-icon { display: none; }
    .is-paused .pause-icon { display: none; }
    .is-paused .play-icon { display: block; }
    .speed-options { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 25px; }
    .speed-options button {
      border: 0;
      border-radius: 20px;
      padding: 7px 13px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      transition: background .18s ease, color .18s ease;
    }
    .speed-options button:hover { color: var(--ink); }
    .speed-options button[aria-pressed="true"] { background: #e6eadf; color: var(--ink); }
    .route { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; letter-spacing: .06em; }
    .route svg { width: 17px; height: 17px; }
    noscript p { text-align: center; color: var(--muted); font-size: 13px; }
    @media (min-width: 1500px) { .intro { padding-top: 45px; padding-bottom: 38px; } }
    @media (max-width: 700px) {
      .page { width: calc(100% - 32px); }
      .masthead { padding: 20px 2px; }
      .brand-name { font-size: 13px; }
      .weather { font-size: 10px; }
      .intro { padding: 30px 0 25px; }
      .intro p { font-size: 11px; }
      .scene-shell { border-radius: 18px; }
      .scene { width: 150%; max-width: none; margin-left: -25%; }
      .scene-corner { font-size: 8px; top: 18px; left: 18px; }
      .controls { justify-content: center; flex-wrap: wrap; gap: 17px; padding-top: 20px; }
      .playback { gap: 12px; }
      .route { width: 100%; justify-content: center; font-size: 10px; }
      .speed-options button { padding: 7px 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>

              <path d="M482 306c26-15 52-9 79 9l29 16 77 5q19-4 27 3 5 6-3 11l-23 2-89-8c-25 11-56 6-78-9-12-8-17-17-19-29Z" fill="#f7f1dd" stroke="#29474a" stroke-width="3"/>
              <path d="M500 313q22 20 51 21l30 2m-66-28q21 15 45 18m107 18 20 1m-28-8 17 1" fill="none" stroke="#c4ccb7" stroke-width="2.5"/>
              <path d="M490 306q15-5 26-1" fill="none" stroke="#fffdf0" stroke-width="3"/>

              <!-- 长喙与下垂喉囊是鹈鹕的主要轮廓特征。 -->
              <path d="M674 190 797 202c-12 11-26 14-38 24-20 18-41 21-61 6-17-13-20-23-24-42Z" fill="url(#pouch)" stroke="#29474a" stroke-width="3"/>
              <path d="M683 206q15 34 44 31" fill="none" stroke="#f7c394" stroke-width="3"/>
              <path d="M675 181q51 0 119 18 11 3 3 12l-6-7-115-6Z" fill="#f2c16b" stroke="#29474a" stroke-width="3"/>
              <path d="m686 190 88 10" fill="none" stroke="#ffe0a1" stroke-width="2.5"/>
              <path d="m786 198 10 3" stroke="#d98352" stroke-width="3"/>
              <path d="M646 193q1 8 10 10" fill="none" stroke="#d5cdb1" stroke-width="2"/>
              <circle cx="660" cy="179" r="9" fill="#f1e5c8"/>
              <g id="eye" transform="translate(661 178)">
                <circle r="4.7" fill="#29474a"/>
                <circle cx="1.3" cy="-1.5" r="1.35" fill="#fffbed"/>
              </g>
              <path id="closed-eye" d="M657 179q4-4 9 0" fill="none" stroke="#29474a" stroke-width="2.5" opacity="0"/>
              <path d="M649 165q6-4 12-1" fill="none" stroke="#29474a" stroke-width="2"/>
              <ellipse cx="649" cy="198" rx="7" ry="4" fill="#edb496" opacity=".55"/>
              <g id="cap">
                <path d="M616 165q6-24 30-24 22 1 33 21-32-6-63 8Z" fill="#63958a" stroke="#29474a" stroke-width="3"/>
                <path d="M646 142q-9 8-8 19" fill="none" stroke="#a3beb0" stroke-width="2"/>
                <path d="M661 161q20-3 35 8-14 5-28 0Z" fill="#3b6b65" stroke="#29474a" stroke-width="2.5"/>
                <path d="m622 164 11-3" stroke="#e1ddbd" stroke-width="2"/>
              </g>
            </g>
          </g>

          <g id="foreground-a" transform="translate(99 629)"><use href="#grass" transform="scale(1.1)"/><use href="#pebble" x="38" y="-1"/></g>
          <g id="foreground-b" transform="translate(1127 637)"><use href="#grass" transform="scale(.88)"/></g>
          <g id="breeze" fill="none" stroke="#fff6df" stroke-width="2.2" stroke-linecap="round" opacity=".8">
            <path id="breeze-a" d="M319 243h51m-64 11h24"/>
            <path id="breeze-b" d="M861 281h35m13 0h11"/>
          </g>
        </svg>
      </div>

      <div class="controls" aria-label="动画控制">
        <div class="playback">
          <button id="play-toggle" class="play-toggle" type="button" aria-label="暂停动画">
            <svg class="pause-icon" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><rect x="4" y="3" width="3" height="10" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/></svg>
            <svg class="play-icon" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M4 2.7q0-1 1-.4l9 5.1q1 .6 0 1.2l-9 5.1q-1 .6-1-.4Z"/></svg>
            <span id="play-label">停一会儿</span>
          </button>
          <div class="speed-options" role="group" aria-label="骑行速度">
            <button type="button" data-speed="1" aria-pressed="true">慢慢骑</button>
            <button type="button" data-speed="1.5" aria-pressed="false">迎着风</button>
            <button type="button" data-speed="2.1" aria-pressed="false">再快点</button>
          </div>
        </div>
        <div class="route">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M2 15h3q4 0 4-4V9q0-4 4-4h4"/><circle cx="3" cy="15" r="2" fill="#f8f5ed"/><path d="m14 2 3 3-3 3"/></svg>
          沿海公路 · 无目的地
        </div>
      </div>
      <noscript><p>当前显示静态画面；启用浏览器 JavaScript 后即可观看骑行动画。</p></noscript>
    </main>
  </div>

  <script>
    (() => {
      'use strict';

      const $ = (id) => document.getElementById(id);
      const elements = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'crank', 'far-pedal', 'near-pedal',
        'far-leg-outline', 'far-leg-color', 'near-leg-outline', 'near-leg-color',
        'near-knee', 'pelican', 'bicycle', 'bike-shadow', 'basket-flower',
        'scarf-long', 'scarf-short', 'eye', 'closed-eye',
        'cloud-a', 'cloud-b', 'cloud-c', 'gulls', 'gull-a', 'gull-b',
        'distant-waves', 'near-waves', 'coastal-sign', 'road-marks',
        'verge-a', 'verge-b', 'pebble-a', 'pebble-b',
        'foreground-a', 'foreground-b', 'breeze-a', 'breeze-b'
      ].map((id) => [id, $(id)]));

      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const toggle = $('play-toggle');
      const speedButtons = [...document.querySelectorAll('[data-speed]')];
      const TAU = Math.PI * 2;
      const toDegrees = 180 / Math.PI;
      let playing = !motionPreference.matches;
      let speed = 1;
      let time = 0;
      let previousTime = null;
      let frameId = null;

      const set = (id, attribute, value) => elements[id].setAttribute(attribute, value);
      const transform = (id, value) => set(id, 'transform', value);
      const move = (id, x, y, extra = '') => transform(id, `translate(${x.toFixed(2)} ${y.toFixed(2)}) ${extra}`);
      const wrap = (x, minimum, width) => ((x - minimum) % width + width) % width + minimum;

      // 两条定长腿骨的交点，选择向前弯曲的膝盖。
      function legPath(hipX, hipY, ankleX, ankleY, upper, lower) {
        const dx = ankleX - hipX;
        const dy = ankleY - hipY;
        const distance = Math.max(0.001, Math.hypot(dx, dy));
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + along * dx / distance + height * dy / distance;
        const kneeY = hipY + along * dy / distance - height * dx / distance;
        return {
          d: `M${hipX.toFixed(2)} ${hipY.toFixed(2)} L${kneeX.toFixed(2)} ${kneeY.toFixed(2)} L${ankleX.toFixed(2)} ${ankleY.toFixed(2)}`,
          x: kneeX,
          y: kneeY
        };
      }

      function render(t) {
        const angle = t * 2.65;
        const bob = Math.sin(angle * 2) * 1.5;
        const birdBob = Math.sin(angle * 2 - .45) * 1.8;
        const wheelAngle = (t * 282 / 79 * toDegrees) % 360;
        const pedalX = 575 + Math.cos(angle) * 26;
        const pedalY = 482 + Math.sin(angle) * 26;
        const farX = 575 - Math.cos(angle) * 26;
        const farY = 482 - Math.sin(angle) * 26;

        transform('rear-spokes', `rotate(${wheelAngle.toFixed(2)})`);
        transform('front-spokes', `rotate(${wheelAngle.toFixed(2)})`);
        transform('crank', `rotate(${(angle * toDegrees % 360).toFixed(2)} 575 482)`);
        move('near-pedal', pedalX, pedalY);
        move('far-pedal', farX, farY);
        move('bicycle', 0, bob);
        move('pelican', 0, birdBob);
        set('bike-shadow', 'rx', (260 - bob * 1.7).toFixed(2));

        const nearLeg = legPath(548, 365 + birdBob, pedalX, pedalY - 11, 75, 82);
        const farLeg = legPath(532, 362 + birdBob, farX, farY - 11, 77, 84);
        set('near-leg-outline', 'd', nearLeg.d);
        set('near-leg-color', 'd', nearLeg.d);
        set('far-leg-outline', 'd', farLeg.d);
        set('far-leg-color', 'd', farLeg.d);
        set('near-knee', 'cx', nearLeg.x.toFixed(2));
        set('near-knee', 'cy', nearLeg.y.toFixed(2));

        const flutter = Math.sin(t * 5.2) * 7;
        const tip = Math.sin(t * 5.2 - 1.4) * 9;
        set('scarf-long', 'd', `M609 243C583 ${250 + flutter} 566 ${222 + flutter} 535 ${235 + tip}l7 10-13 8C564 ${239 + tip} 582 ${270 + flutter} 609 254Z`);
        set('scarf-short', 'd', `M608 246Q584 ${254 - flutter * .5} 570 ${274 - tip * .4}l-2-11-10-1Q582 ${239 - flutter * .5} 607 237Z`);
        transform('basket-flower', `translate(796 355) rotate(${(Math.sin(t * 3.7) * 5 + 2).toFixed(2)})`);

        const blinkCycle = t % 5.8;
        const blinking = blinkCycle > 5.52 && blinkCycle < 5.69;
        set('eye', 'opacity', blinking ? '0' : '1');
        set('closed-eye', 'opacity', blinking ? '1' : '0');

        move('cloud-a', wrap(112 - t * 5, -200, 1500), 113, 'scale(1.12)');
        move('cloud-b', wrap(770 - t * 3.4, -160, 1450), 74, 'scale(.72)');
        move('cloud-c', wrap(1085 - t * 7, -180, 1500), 236, 'scale(.94)');
        move('gulls', wrap(-t * 10, -450, 1500), Math.sin(t * .7) * 7);
        const flap = Math.sin(t * 2.4) * 4;
        set('gull-a', 'd', `M337 ${168 - flap}q10-9 20 ${flap} 10-9 20 ${-flap}`);
        set('gull-b', 'd', `M395 ${138 + flap * .7}q7-6 14 ${-flap * .7} 7-6 14 ${flap * .7}`);
        move('distant-waves', -(t * 8 % 100), 0);
        move('near-waves', -(t * 22 % 260), Math.sin(t) * .8);
        move('road-marks', -(t * 282 % 240), 0);
        move('coastal-sign', wrap(1060 - t * 46, -100, 1600), 431);
        move('verge-a', wrap(154 - t * 125, -100, 1450), 480);
        move('verge-b', wrap(978 - t * 125, -100, 1450), 487);
        move('pebble-a', wrap(285 - t * 225, -70, 1360), 552);
        move('pebble-b', wrap(1034 - t * 243, -70, 1360), 571);
        move('foreground-a', wrap(99 - t * 315, -100, 1450), 629);
        move('foreground-b', wrap(1127 - t * 315, -100, 1450), 637);
        move('breeze-a', -((t * 29) % 70), 0);
        move('breeze-b', -((t * 23 + 21) % 55), Math.sin(t) * 3);
        set('breeze-a', 'opacity', (.25 + .5 * (Math.sin(t * 2) + 1) / 2).toFixed(2));
        set('breeze-b', 'opacity', (.2 + .5 * (Math.sin(t * 2 + Math.PI) + 1) / 2).toFixed(2));
      }

      function frame(now) {
        frameId = null;
        if (!playing || document.hidden) { previousTime = null; return; }
        if (previousTime !== null) time += Math.min((now - previousTime) / 1000, .05) * speed;
        previousTime = now;
        render(time);
        frameId = requestAnimationFrame(frame);
      }

      function syncPlayback() {
        toggle.classList.toggle('is-paused', !playing);
        toggle.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        $('play-label').textContent = playing ? '停一会儿' : '继续兜风';
        previousTime = null;
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = playing && !document.hidden ? requestAnimationFrame(frame) : null;
      }

      toggle.addEventListener('click', () => { playing = !playing; syncPlayback(); });
      speedButtons.forEach((button) => button.addEventListener('click', () => {
        speed = Number(button.dataset.speed);
        speedButtons.forEach((option) => option.setAttribute('aria-pressed', String(option === button)));
      }));
      document.addEventListener('visibilitychange', syncPlayback);
      motionPreference.addEventListener('change', (event) => {
        if (event.matches) { playing = false; syncPlayback(); }
      });
      document.addEventListener('keydown', (event) => {
        if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.target instanceof Element && event.target.closest('button, input, select, textarea, a, [contenteditable]')) return;
        event.preventDefault();
        playing = !playing;
        syncPlayback();
      });

      render(0);
      syncPlayback();
    })();
  </script>
</body>
</html>
